name: Build ISO
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash tests/test_startup_sound.sh
      - run: bash tests/test_assets.sh
      - run: bash tests/test_dock_package.sh
      - run: bash tests/test_live_scripts.sh
      - run: bash tests/test_boot_sound.sh
      - run: bash tests/test_installer_config.sh

  components:
    needs: checks
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get install -y build-essential cmake extra-cmake-modules dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools libkf6windowsystem-dev \
            liblayershellqtinterface-dev libplasma-dev plasma-workspace-dev
      - name: Lint QML (fails on syntax errors)
        run: |
          find . -name '*.qml' -not -path './iso/*sddm*' | xargs /usr/lib/qt6/bin/qmllint --compiler off 2>&1 | tee qmllint.log || true
          ! grep -E 'Error|error:' qmllint.log
      - name: Build dock .deb
        run: |
          cmake -S components/sequoia-dock -B build-dock -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dock -j"$(nproc)"
          bash scripts/make-dock-deb.sh build-dock/sequoia-dock components/out
          ls -l components/out
      - name: Build macOS-style window decoration (optional; failure here does not stop the ISO)
        continue-on-error: true
        run: |
          for p in cmake git gettext python3 file extra-cmake-modules libkf6guiaddons-dev libkf6i18n-dev libkf6kcmutils-dev \
                   libkf6windowsystem-dev libkf6config-dev libkf6coreaddons-dev libkf6configwidgets-dev libkf6iconthemes-dev; do
            apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 || echo "package unavailable: $p"
          done
          apt-get install -y --no-install-recommends $(apt-cache search kdecoration | awk '{print $1}' | grep -- '-dev$') || true
          bash scripts/build-decoration.sh components/out
          ls -l components/out
      - uses: actions/upload-artifact@v4
        with: { name: components, path: components/out/*.deb, if-no-files-found: error }

  iso:
    needs: components
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: components, path: components/out }
      - name: Build ISO (live-build inside debian:trixie)
        run: docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash scripts/build-iso.sh
      - name: Locate ISO
        id: iso
        run: |
          sudo chown -R "$(id -u):$(id -g)" build build.log 2>/dev/null || true
          ISO=$(ls build/*.iso 2>/dev/null | head -n1 || true)
          [ -n "$ISO" ] || { echo "::error::No ISO produced"; exit 1; }
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
      - name: Checksum
        run: sha256sum "${{ steps.iso.outputs.path }}" | tee "${{ steps.iso.outputs.path }}.sha256"
      - name: Verify ISO (exists, not empty, mandatory assets present)
        id: verify
        run: docker run --rm -v "$PWD":/work -w /work debian:trixie bash scripts/verify-iso.sh "${{ steps.iso.outputs.path }}"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log, if-no-files-found: ignore }
      - name: Upload ISO (named UNVERIFIED if the checks failed, so you can still test it)
        if: always() && steps.iso.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-linux-iso-${{ steps.verify.outcome == 'success' && 'verified' || 'UNVERIFIED' }}
          path: |
            build/*.iso
            build/*.iso.sha256
          if-no-files-found: error
          retention-days: 7
